[project]
name = "vsa-ccg"
version = "0.0.1"
description = "Superposition of CCG parsers via Vector Symbolic Architectures (VSA)."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Honoka Kobayashi", email = "hononyanpo@gmail.com" },
]
dependencies = [
    "torch>=2.4",
    "torch-hd>=5.8",
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "ipykernel",
    "matplotlib",
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vsa_ccg"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
